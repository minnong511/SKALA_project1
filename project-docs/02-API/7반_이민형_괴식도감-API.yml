---
openapi: 3.0.3
info:
  title: 괴식도감 API 명세서
  version: 0.2.0
  description: |
    7반 이민형. 프로젝트 기술서 초안_v2.md 기반 API 설계 초안.
    5장의 API 목록과 6장의 본인 후기 삭제 요구를 반영했다.
    기본 경로와 배포 서버는 미정이다. 경로에 공통 접두사는 붙이지 않았다.
    작성 범위에 따라 Security Schemes는 제외했다. 실제 인증 생략을 뜻하지 않는다.
    x-access는 public, user, owner, admin으로 접근 조건을 표시하는 문서용 확장이다.
    user는 로그인 사용자, owner는 해당 후기 작성자, admin은 관리자 역할이 필요하다.
    현재 사용자 ID는 인증 상태에서 식별하며 타인의 ID를 입력받아 처리하지 않는다.
    4장과 6장의 충돌은 6.1절 선택안을 우선하는 가정이다. 중복 기준은 유사도 80% 이상,
    메뉴 평점은 sum(rating*w(n))/sum(w(n)), w(n)=0.3+0.7/(1+ln(n))이다.
    n은 같은 사용자가 같은 메뉴에 작성한 후기 순서이며 created_at, review_id 순을 제안한다.
    응답 스키마, 오류 상태, 페이지 크기, enum 전달값, multipart 형식은 구현용 초안이다.
    UI의 맛 성향 표시 필드는 저장 위치와 산정 방식이 미정이므로 별도 API 필드로 확정하지 않았다.
x-source-document: "../01-기획-요구사항/프로젝트 기술서 초안_v2.md"
x-related-dbml: "../03-DB/7반_이민형_괴식도감-DB.dbml"
x-status: draft
x-open-questions:
- 인증 수단, 구글 인증 전달 방식과 신규 구글 계정 생성 흐름
- 설문 문항별 단일 또는 복수 선택, 자유 입력 범위와 배열 저장 형식
- 비로그인 도감 조회 허용 여부
- 중복 비교 표준화, 복수 후보 연결, 동시 생성 방지
- 후기 삭제 이후 순서와 가중치 유지 또는 재계산
- 대표 이미지 대체, 후기 없음 평점 표시, 관리자 연결 데이터 삭제 정책
- 데일리 추천 개수와 갱신, 인기순 산정, 챗봇 문맥과 저장
- 기본 음료의 재료 정보 확보 및 불명확한 재료의 제외 조건 처리
- 영수증 임시 인증 저장소와 유효 시간, 외부 LLM의 데이터 보관
- 파일 형식과 용량, 일반 후기 이미지 필수 여부, 후기 글자 수
- 맛 성향 표시 데이터와 변경 옵션의 원재료 표현
- 관리자 신규 메뉴 등록의 영수증과 첫 후기 요구 여부
tags:
- name: 계정
- name: 도감
- name: 북마크
- name: 취향과 추천
- name: 메뉴 등록
- name: 후기
- name: 관리자
paths:
  "/auth/signup":
    post:
      operationId: signup
      tags:
      - 계정
      summary: 이메일 회원가입
      x-access: public
      description: 일반 사용자 역할 USER로 생성. 관리자 역할은 요청으로 받을 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SignupRequest"
      responses:
        '201':
          description: 이메일 회원가입 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '400':
          "$ref": "#/components/responses/400"
        '409':
          "$ref": "#/components/responses/409"
  "/auth/login":
    post:
      operationId: login
      tags:
      - 계정
      summary: 이메일 로그인
      x-access: public
      description: 사용자와 관리자는 같은 API를 사용하고 반환된 역할과 설문 완료 여부에 따라 화면을 분기한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: 이메일 로그인 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResult"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
  "/auth/google":
    post:
      operationId: googleLogin
      tags:
      - 계정
      summary: 구글 로그인
      x-access: public
      description: 구글 인증 결과를 서버에서 검증한다. 이메일 일치만으로 기존 계정에 자동 연결하지 않는다. 신규 계정 생성 흐름은
        확인 필요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GoogleCredential"
      responses:
        '200':
          description: 구글 로그인 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResult"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '409':
          "$ref": "#/components/responses/409"
        '503':
          "$ref": "#/components/responses/503"
  "/me/external-accounts/google":
    post:
      operationId: linkGoogle
      tags:
      - 계정
      summary: 구글 계정 연결
      x-access: user
      description: 현재 로그인 사용자에게 검증된 구글 계정을 연결한다. 이미 다른 사용자에게 연결된 계정은 거부한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GoogleCredential"
      responses:
        '200':
          description: 구글 계정 연결 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: &2
                    type: boolean
                required:
                - linked
        '400':
          "$ref": "#/components/responses/400"
        '409':
          "$ref": "#/components/responses/409"
        '503':
          "$ref": "#/components/responses/503"
        '401':
          "$ref": "#/components/responses/401"
  "/me":
    get:
      operationId: getMe
      tags:
      - 계정
      summary: 현재 로그인 사용자 조회
      x-access: user
      responses:
        '200':
          description: 현재 로그인 사용자 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          "$ref": "#/components/responses/401"
  "/auth/logout":
    post:
      operationId: logout
      tags:
      - 계정
      summary: 로그아웃
      x-access: user
      description: 서버의 로그인 상태를 종료한다. 인증 수단별 무효화 방식은 확인 필요.
      responses:
        '204':
          description: 처리 완료, 응답 본문 없음
        '401':
          "$ref": "#/components/responses/401"
  "/menus":
    get:
      operationId: listMenus
      tags:
      - 도감
      summary: 메뉴 목록 조회
      x-access: user
      description: 초안은 로그인 필요. 비로그인 조회 허용 여부는 확인 필요.
      parameters:
      - "$ref": "#/components/parameters/category"
      - "$ref": "#/components/parameters/sort"
      - "$ref": "#/components/parameters/page"
      - "$ref": "#/components/parameters/size"
      responses:
        '200':
          description: 메뉴 목록 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MenuPage"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
    post:
      operationId: createMenu
      tags:
      - 메뉴 등록
      summary: 신규 메뉴와 첫 후기 동시 등록
      x-access: user
      description: payload는 JSON 파트, images는 파일 파트다. 메뉴와 첫 후기를 한 트랜잭션으로 저장하고 첫 이미지를
        대표 이미지로 지정한다. 인증 소유자, 브랜드, 만료, 사용 여부를 검증하고 성공 시 일회성으로 소비한다. 등록 직전 중복을 다시 판정하고
        중복이면 409와 후보 정보를 Error.details에 반환한다. 실패 시 부분 저장과 임시 파일을 정리한다. 동시 등록과 재시도
        방지 구현은 확인 필요. 관리자 예외는 미정이며 초안에서는 같은 조건을 적용한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                payload:
                  "$ref": "#/components/schemas/NewMenuPayload"
                images:
                  type: array
                  items: &1
                    type: string
                    format: binary
                  maxItems: 5
                  description: 업로드 순서대로 저장. 파일 형식과 용량 제한은 확인 필요.
                  minItems: 1
              required:
              - payload
              - images
            encoding:
              payload:
                contentType: application/json
      responses:
        '201':
          description: 신규 메뉴와 첫 후기 동시 등록 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MenuCreated"
        '400':
          "$ref": "#/components/responses/400"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '413':
          "$ref": "#/components/responses/413"
        '415':
          "$ref": "#/components/responses/415"
        '422':
          "$ref": "#/components/responses/422"
        '401':
          "$ref": "#/components/responses/401"
  "/menus/{menu_id}":
    get:
      operationId: getMenu
      tags:
      - 도감
      summary: 메뉴 상세 조회
      x-access: user
      description: 평점은 가중 집계값이다. 후기 목록은 별도 API로 조회한다.
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      responses:
        '200':
          description: 메뉴 상세 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MenuDetail"
        '404':
          "$ref": "#/components/responses/404"
        '401':
          "$ref": "#/components/responses/401"
  "/menus/{menu_id}/reviews":
    get:
      operationId: listMenuReviews
      tags:
      - 후기
      summary: 메뉴별 후기 조회
      x-access: user
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      - "$ref": "#/components/parameters/page"
      - "$ref": "#/components/parameters/size"
      responses:
        '200':
          description: 메뉴별 후기 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReviewPage"
        '400':
          "$ref": "#/components/responses/400"
        '404':
          "$ref": "#/components/responses/404"
        '401':
          "$ref": "#/components/responses/401"
    post:
      operationId: createReview
      tags:
      - 후기
      summary: 기존 메뉴에 후기 등록
      x-access: user
      description: 동일 사용자와 메뉴의 반복 후기 허용. 대상 메뉴 브랜드와 현재 사용자에 연결된 인증을 검증하고 성공 시 소비한다.
        images는 최대 5장이며 일반 후기의 최소 개수는 확인 필요. 개인 평점은 1~5점, 메뉴 집계에는 반복 후기 가중치를 적용한다.
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                payload:
                  "$ref": "#/components/schemas/ReviewPayload"
                images:
                  type: array
                  items: *1
                  maxItems: 5
                  description: 업로드 순서대로 저장. 파일 형식과 용량 제한은 확인 필요.
              required:
              - payload
            encoding:
              payload:
                contentType: application/json
      responses:
        '201':
          description: 기존 메뉴에 후기 등록 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Review"
        '400':
          "$ref": "#/components/responses/400"
        '404':
          "$ref": "#/components/responses/404"
        '413':
          "$ref": "#/components/responses/413"
        '415':
          "$ref": "#/components/responses/415"
        '422':
          "$ref": "#/components/responses/422"
        '401':
          "$ref": "#/components/responses/401"
  "/me/bookmarks/{menu_id}":
    put:
      operationId: addBookmark
      tags:
      - 북마크
      summary: 메뉴 북마크 추가
      x-access: user
      description: 현재 사용자의 북마크를 생성한다. 반복 요청에도 한 건만 유지한다. is_bookmarked는 true다.
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      responses:
        '200':
          description: 메뉴 북마크 추가 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BookmarkState"
        '404':
          "$ref": "#/components/responses/404"
        '401':
          "$ref": "#/components/responses/401"
    delete:
      operationId: removeBookmark
      tags:
      - 북마크
      summary: 메뉴 북마크 해제
      x-access: user
      description: 북마크가 이미 없어도 204를 반환하는 초안.
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      responses:
        '204':
          description: 처리 완료, 응답 본문 없음
        '401':
          "$ref": "#/components/responses/401"
  "/me/bookmarks":
    get:
      operationId: listMyBookmarks
      tags:
      - 북마크
      summary: 내 북마크 목록 조회
      x-access: user
      description: saved_at 최신순으로 조회한다.
      parameters:
      - "$ref": "#/components/parameters/page"
      - "$ref": "#/components/parameters/size"
      responses:
        '200':
          description: 내 북마크 목록 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BookmarkPage"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
  "/me/preferences":
    get:
      operationId: getPreferences
      tags:
      - 취향과 추천
      summary: 내 선호 조회
      x-access: user
      description: 설문 미완료로 선호 정보가 없으면 404를 반환한다.
      responses:
        '200':
          description: 내 선호 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Preference"
        '404':
          "$ref": "#/components/responses/404"
        '401':
          "$ref": "#/components/responses/401"
    put:
      operationId: savePreferences
      tags:
      - 취향과 추천
      summary: 내 선호 저장 및 갱신
      x-access: user
      description: 현재 사용자만 대상으로 생성 또는 갱신한다. 과거 이력은 저장하지 않는다. 저장 후 별도로 추천을 요청하며 추천
        실패에도 응답은 유지된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PreferenceInput"
      responses:
        '200':
          description: 내 선호 저장 및 갱신 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Preference"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
  "/me/recommendations/survey":
    get:
      operationId: getSurveyRecommendation
      tags:
      - 취향과 추천
      summary: 설문 결과 추천 조회
      x-access: user
      description: DB에 등록된 메뉴만 추천한다. 먹지 못하는 재료는 제외하고 선호 조건만 완화할 수 있다. 후보와 최종 결과에 제외
        조건을 확인한다. 재료 데이터가 불명확한 메뉴의 처리 정책은 확인 필요. 정상 추천은 1개, 후보 없음은 빈 배열로 제안한다.
      responses:
        '200':
          description: 설문 결과 추천 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SurveyRecommendation"
        '404':
          "$ref": "#/components/responses/404"
        '503':
          "$ref": "#/components/responses/503"
        '401':
          "$ref": "#/components/responses/401"
  "/me/recommendations/daily":
    get:
      operationId: getDailyRecommendations
      tags:
      - 취향과 추천
      summary: 데일리 추천 조회
      x-access: user
      description: DB에 등록된 메뉴만 추천한다. 먹지 못하는 재료는 제외하고 선호 조건만 완화할 수 있다. 후보와 최종 결과에 제외
        조건을 확인한다. 재료 데이터가 불명확한 메뉴의 처리 정책은 확인 필요. 추천 수와 갱신 시점은 확인 필요.
      responses:
        '200':
          description: 데일리 추천 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RecommendationList"
        '404':
          "$ref": "#/components/responses/404"
        '503':
          "$ref": "#/components/responses/503"
        '401':
          "$ref": "#/components/responses/401"
  "/recommendations/chat":
    post:
      operationId: chatRecommendation
      tags:
      - 취향과 추천
      summary: 챗봇 추천 요청
      x-access: user
      description: DB에 등록된 메뉴만 추천한다. 먹지 못하는 재료는 제외하고 선호 조건만 완화할 수 있다. 후보와 최종 결과에 제외
        조건을 확인한다. 재료 데이터가 불명확한 메뉴의 처리 정책은 확인 필요. 대화 이력 전달과 보관 방식은 미정이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ChatRequest"
      responses:
        '200':
          description: 챗봇 추천 요청 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ChatResult"
        '400':
          "$ref": "#/components/responses/400"
        '404':
          "$ref": "#/components/responses/404"
        '503':
          "$ref": "#/components/responses/503"
        '401':
          "$ref": "#/components/responses/401"
  "/brands":
    get:
      operationId: listBrands
      tags:
      - 메뉴 등록
      summary: 브랜드 목록 조회
      x-access: user
      responses:
        '200':
          description: 브랜드 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Brand"
        '401':
          "$ref": "#/components/responses/401"
  "/menus/duplicate-check":
    post:
      operationId: checkDuplicate
      tags:
      - 메뉴 등록
      summary: 메뉴 중복 후보 확인
      x-access: user
      description: 같은 브랜드 안에서 기본 음료, 옵션 재료와 수량, 사이즈, 온도를 표준화한 뒤 교집합/합집합 유사도를 계산한다.
        6.1절에 따라 0.8 이상을 중복으로 취급한다. 등록 시 다시 검사한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RecipeInput"
      responses:
        '200':
          description: 메뉴 중복 후보 확인 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DuplicateResult"
        '400':
          "$ref": "#/components/responses/400"
        '404':
          "$ref": "#/components/responses/404"
        '401':
          "$ref": "#/components/responses/401"
  "/receipt-verifications":
    post:
      operationId: verifyReceipt
      tags:
      - 메뉴 등록
      summary: 영수증 확인
      x-access: user
      description: LLM으로 카페 구매 사실과 선택 브랜드를 확인한다. 성공 후 사용자와 브랜드에 연결된 일회성 인증을 발급한다.
        원본과 추출 내용은 처리 후 폐기하고 DB와 로그에 남기지 않는다. 영수증 진위와 세부 레시피 구매를 보장하지 않는다. 인증 유효 시간과
        외부 제공자 보관 정책은 확인 필요.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                brand_id:
                  type: integer
                  format: int64
                  minimum: 1
                receipt: *1
              required:
              - brand_id
              - receipt
      responses:
        '200':
          description: 영수증 확인 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VerificationResult"
        '400':
          "$ref": "#/components/responses/400"
        '404':
          "$ref": "#/components/responses/404"
        '413':
          "$ref": "#/components/responses/413"
        '415':
          "$ref": "#/components/responses/415"
        '422':
          "$ref": "#/components/responses/422"
        '503':
          "$ref": "#/components/responses/503"
        '401':
          "$ref": "#/components/responses/401"
  "/me/reviews":
    get:
      operationId: listMyReviews
      tags:
      - 후기
      summary: 내 후기 목록 조회
      x-access: user
      parameters:
      - "$ref": "#/components/parameters/page"
      - "$ref": "#/components/parameters/size"
      responses:
        '200':
          description: 내 후기 목록 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MyReviewPage"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
  "/me/reviews/{review_id}":
    delete:
      operationId: deleteMyReview
      tags:
      - 후기
      summary: 본인 후기 삭제
      x-access: owner
      description: 6.1절의 본인 후기 삭제 요구를 반영한 추가 경로 초안. 소유자만 삭제할 수 있다. 연결 이미지를 먼저 정리해
        FK 제한을 지키며 공용 메뉴는 삭제하지 않는다. 대표 이미지 처리와 삭제 후 가중치 정책은 확인 필요. 정책상 처리할 수 없는 경우
        409를 반환하는 초안이다.
      parameters:
      - "$ref": "#/components/parameters/review_id"
      responses:
        '204':
          description: 처리 완료, 응답 본문 없음
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
  "/admin/menus":
    get:
      operationId: adminListMenus
      tags:
      - 관리자
      summary: 관리자용 메뉴 목록 조회
      x-access: admin
      parameters:
      - "$ref": "#/components/parameters/page"
      - "$ref": "#/components/parameters/size"
      responses:
        '200':
          description: 관리자용 메뉴 목록 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MenuPage"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
  "/admin/menus/{menu_id}":
    get:
      operationId: adminGetMenu
      tags:
      - 관리자
      summary: 관리자용 메뉴 상세 조회
      x-access: admin
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      responses:
        '200':
          description: 관리자용 메뉴 상세 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MenuDetail"
        '404':
          "$ref": "#/components/responses/404"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
    patch:
      operationId: adminUpdateLevel
      tags:
      - 관리자
      summary: 괴식 등급 변경
      x-access: admin
      description: 이번 초안은 괴식 등급만 수정한다. 레시피 수정 정책은 확인 필요.
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LevelPatch"
      responses:
        '200':
          description: 괴식 등급 변경 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MenuDetail"
        '400':
          "$ref": "#/components/responses/400"
        '404':
          "$ref": "#/components/responses/404"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
    delete:
      operationId: adminDeleteMenu
      tags:
      - 관리자
      summary: 메뉴 삭제
      x-access: admin
      description: FK 제한을 적용한다. 연결된 후기, 이미지, 북마크, 옵션의 삭제 정책이 확정되지 않은 경우 409를 반환하는
        초안. 연쇄 삭제를 가정하지 않는다.
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      responses:
        '204':
          description: 처리 완료, 응답 본문 없음
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
  "/admin/brands":
    post:
      operationId: adminCreateBrand
      tags:
      - 관리자
      summary: 브랜드 추가
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/BrandRequest"
      responses:
        '201':
          description: 브랜드 추가 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Brand"
        '400':
          "$ref": "#/components/responses/400"
        '409':
          "$ref": "#/components/responses/409"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
  "/admin/brands/{brand_id}":
    delete:
      operationId: adminDeleteBrand
      tags:
      - 관리자
      summary: 브랜드 삭제
      x-access: admin
      description: 연결 메뉴가 있으면 FK 제한에 따라 409를 반환한다. 추가 삭제 정책은 확인 필요.
      parameters:
      - "$ref": "#/components/parameters/brand_id"
      responses:
        '204':
          description: 처리 완료, 응답 본문 없음
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
components:
  parameters:
    menu_id:
      name: menu_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    brand_id:
      name: brand_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    review_id:
      name: review_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    page:
      name: page
      in: query
      description: 1부터 시작하는 초안
      schema:
        type: integer
        minimum: 1
        default: 1
    size:
      name: size
      in: query
      description: 기본 20개, 최대 100개로 제안
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    category:
      name: category
      in: query
      schema: &3
        type: string
        enum:
        - 커피
        - 스무디
        - 티
    sort:
      name: sort
      in: query
      description: 인기순 점수 산정 방식은 확인 필요
      schema:
        type: string
        enum:
        - latest
        - popular
        default: latest
  responses:
    '400':
      description: 입력 형식 또는 조건 오류
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '401':
      description: 로그인 필요 또는 인증 실패
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '403':
      description: 관리자 권한 또는 본인 소유 권한 없음
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '404':
      description: 대상 데이터 없음
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '409':
      description: 중복 등록, 계정 연결 충돌 또는 연결 데이터로 처리 불가
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '413':
      description: 업로드 용량 초과, 제한값 확인 필요
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '415':
      description: 지원하지 않는 파일 또는 콘텐츠 형식
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '422':
      description: 영수증 판독 실패, 브랜드 불일치, 만료 또는 사용된 인증
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '503':
      description: LLM 또는 외부 서비스 일시 오류
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: 기계 판독용 오류 코드
        message:
          type: string
          description: 사용자 안내
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
    User:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 50
        role:
          type: string
          enum:
          - USER
          - ADMIN
        survey_completed: *2
      required:
      - user_id
      - email
      - display_name
      - role
      - survey_completed
    Author:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
      required:
      - user_id
      - display_name
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          description: 비밀번호 정책 확인 필요
          format: password
          writeOnly: true
        display_name:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - email
      - password
      - display_name
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
      required:
      - email
      - password
    GoogleCredential:
      type: object
      properties:
        id_token:
          type: string
          description: 구글 ID 토큰을 전달하는 초안. 최종 인증 전달 방식은 확인 필요.
          writeOnly: true
      required:
      - id_token
    LoginResult:
      type: object
      properties:
        user:
          "$ref": "#/components/schemas/User"
      required:
      - user
      description: 로그인 상태를 서버가 설정한다. 쿠키 또는 토큰 전달 방식은 확인 필요.
    Brand:
      type: object
      properties:
        brand_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 100
      required:
      - brand_id
      - name
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    PreferenceInput:
      type: object
      properties:
        preferred_categories:
          type: array
          items: *3
          minItems: 1
          uniqueItems: true
        preferred_tastes:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        sweetness_preference:
          type: string
          minLength: 1
          maxLength: 50
        excluded_ingredients:
          type: array
          items:
            type: string
          uniqueItems: true
          description: 먹지 못하는 재료. 해당 없음은 빈 배열.
        challenge_level: &9
          type: string
          enum:
          - 초심자
          - 중급자
          - 상급자
      required:
      - preferred_categories
      - preferred_tastes
      - sweetness_preference
      - excluded_ingredients
      - challenge_level
      description: 5개 문항 응답. 선택형과 자유 입력을 배열 및 문자열로 전달하는 초안이며 세부 응답 형식은 확인 필요.
    Preference:
      allOf:
      - "$ref": "#/components/schemas/PreferenceInput"
      - type: object
        properties:
          updated_at: &10
            type: string
            format: date-time
        required:
        - updated_at
    MenuOptionInput:
      type: object
      properties:
        action:
          type: string
          enum:
          - 추가
          - 제외
          - 변경
        ingredient_name:
          type: string
          minLength: 1
          maxLength: 100
        quantity:
          type: number
          nullable: true
          description: 수량을 사용하는 옵션은 필수. 단순 제외는 null 허용.
        unit:
          type: string
          description: 수량 사용 시 필수
          nullable: true
          maxLength: 30
      required:
      - action
      - ingredient_name
    MenuOption:
      allOf:
      - "$ref": "#/components/schemas/MenuOptionInput"
      - type: object
        properties:
          option_id:
            type: integer
            format: int64
            minimum: 1
        required:
        - option_id
    RecipeInput:
      type: object
      properties:
        brand_id: &4
          type: integer
          format: int64
          minimum: 1
        base_drink: &5
          type: string
          minLength: 1
          maxLength: 100
        size: &6
          type: string
          description: 표준값과 누락 처리 기준은 확인 필요
          nullable: true
          maxLength: 50
        temperature: &7
          type: string
          description: 표준값과 누락 처리 기준은 확인 필요
          nullable: true
          maxLength: 30
        options: &8
          type: array
          items:
            "$ref": "#/components/schemas/MenuOptionInput"
      required:
      - brand_id
      - base_drink
      - options
    MenuInput:
      type: object
      properties:
        brand_id: *4
        base_drink: *5
        size: *6
        temperature: *7
        options: *8
        name:
          type: string
          minLength: 1
          maxLength: 100
        category: *3
        weirdness_level: *9
        recipe_description:
          type: string
          nullable: true
      required:
      - brand_id
      - base_drink
      - options
      - name
      - category
      - weirdness_level
    MenuCard:
      type: object
      properties:
        menu_id:
          type: integer
          format: int64
          minimum: 1
        brand:
          "$ref": "#/components/schemas/Brand"
        name:
          type: string
        category: *3
        weirdness_level: *9
        representative_image_url:
          type: string
          format: uri
          nullable: true
        average_rating:
          type: number
          minimum: 1
          maximum: 5
          nullable: true
          description: 6.1절의 가중 평점. 후기 없음은 null로 제안. 표시 자릿수는 확인 필요.
        review_count:
          type: integer
          minimum: 0
        is_bookmarked: *2
        created_at: *10
      required:
      - menu_id
      - brand
      - name
      - category
      - weirdness_level
      - representative_image_url
      - average_rating
      - review_count
      - is_bookmarked
      - created_at
    MenuDetail:
      allOf:
      - "$ref": "#/components/schemas/MenuCard"
      - type: object
        properties:
          base_drink:
            type: string
          size:
            type: string
            nullable: true
          temperature:
            type: string
            nullable: true
          recipe_description:
            type: string
            nullable: true
          options:
            type: array
            items:
              "$ref": "#/components/schemas/MenuOption"
        required:
        - base_drink
        - options
    ReviewImage:
      type: object
      properties:
        image_id:
          type: integer
          format: int64
          minimum: 1
        image_url:
          type: string
          format: uri
        display_order:
          type: integer
          minimum: 1
          maximum: 5
      required:
      - image_id
      - image_url
      - display_order
    Review:
      type: object
      properties:
        review_id:
          type: integer
          format: int64
          minimum: 1
        menu_id:
          type: integer
          format: int64
          minimum: 1
        author:
          "$ref": "#/components/schemas/Author"
        rating: &11
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
          nullable: true
        images:
          type: array
          items:
            "$ref": "#/components/schemas/ReviewImage"
          maxItems: 5
        created_at: *10
      required:
      - review_id
      - menu_id
      - author
      - rating
      - images
      - created_at
    ReviewInput:
      type: object
      properties:
