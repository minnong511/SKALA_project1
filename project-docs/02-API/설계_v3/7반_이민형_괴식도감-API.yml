tags:
- name: 계정
- name: 도감
- name: 북마크
- name: 취향과 추천
- name: 메뉴 등록
- name: 후기
- name: 관리자
paths:
  "/api/users":
    post:
      operationId: signup
      tags:
      - 계정
      summary: 이메일 회원가입
      x-access: public
      description: |-
        요구사항: REQ-FUNC-001
        화면: SCR-AUTH-001
        DB: users
        이메일은 trim 후 소문자로 정규화한다. 공개 가입은 USER 역할만 생성한다. 비밀번호는 UTF-8 72바이트 이내의 BCrypt 입력으로 제한한다. 관리자 승격은 운영자가 별도 수행한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SignupRequest"
      responses:
        '201':
          description: 이메일 회원가입 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                user_id: 1
                email: user@example.com
                display_name: 예시
                role: USER
                survey_completed: false
        '400':
          "$ref": "#/components/responses/400"
        '409':
          "$ref": "#/components/responses/409"
        '403':
          "$ref": "#/components/responses/403"
        '500':
          "$ref": "#/components/responses/500"
      x-requirements:
      - REQ-FUNC-001
      x-screens:
      - SCR-AUTH-001
      x-db-tables:
      - users
      parameters:
      - "$ref": "#/components/parameters/csrf"
  "/api/auth/sessions":
    post:
      operationId: login
      tags:
      - 계정
      summary: 이메일 로그인
      x-access: public
      description: |-
        요구사항: REQ-FUNC-001
        화면: SCR-AUTH-001
        DB: users
        사용자와 관리자는 같은 API를 사용하고 반환된 역할과 설문 완료 여부에 따라 화면을 분기한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: 이메일 로그인 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResult"
              example:
                user:
                  user_id: 1
                  email: user@example.com
                  display_name: 예시
                  role: USER
                  survey_completed: false
          headers:
            Set-Cookie:
              description: 서버 세션 쿠키. 브라우저가 저장하며 JS에서 직접 읽지 않는다.
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '500':
          "$ref": "#/components/responses/500"
      x-requirements:
      - REQ-FUNC-001
      x-screens:
      - SCR-AUTH-001
      x-db-tables:
      - users
      parameters:
      - "$ref": "#/components/parameters/csrf"
  "/api/auth/google-sessions":
    post:
      operationId: googleLogin
      tags:
      - 계정
      summary: 구글 로그인
      x-access: public
      description: |-
        요구사항: REQ-FUNC-002
        화면: SCR-AUTH-001
        DB: users, external_accounts
        검증된 sub로 사용자를 조회한다. 연결 계정이 없고 같은 이메일의 기존 계정도 없으면 이메일과 표시 이름으로 새 USER를 생성하고 외부 계정을 연결한다. 같은 이메일의 기존 계정이 있으면 409로 계정 연결을 안내한다. 신규 구글 가입은 구현 제안이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GoogleCredential"
      responses:
        '200':
          description: 구글 로그인 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResult"
              example:
                user:
                  user_id: 1
                  email: user@example.com
                  display_name: 예시
                  role: USER
                  survey_completed: false
          headers:
            Set-Cookie:
              description: 서버 세션 쿠키. 브라우저가 저장하며 JS에서 직접 읽지 않는다.
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '409':
          "$ref": "#/components/responses/409"
        '503':
          "$ref": "#/components/responses/503"
        '403':
          "$ref": "#/components/responses/403"
        '500':
          "$ref": "#/components/responses/500"
        '504':
          "$ref": "#/components/responses/504"
      x-requirements:
      - REQ-FUNC-002
      x-screens:
      - SCR-AUTH-001
      x-db-tables:
      - users
      - external_accounts
      parameters:
      - "$ref": "#/components/parameters/csrf"
  "/api/me/external-accounts/google":
    post:
      operationId: linkGoogle
      tags:
      - 계정
      summary: 구글 계정 연결
      x-access: user
      description: |-
        요구사항: REQ-FUNC-002
        화면: SCR-ME-001
        DB: users, external_accounts
        현재 로그인 사용자에게 검증된 구글 계정을 연결한다. 이미 다른 사용자에게 연결된 계정은 거부한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GoogleCredential"
      responses:
        '200':
          description: 구글 계정 연결 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: &2
                    type: boolean
                required:
                - linked
              example:
                linked: false
        '400':
          "$ref": "#/components/responses/400"
        '409':
          "$ref": "#/components/responses/409"
        '503':
          "$ref": "#/components/responses/503"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '500':
          "$ref": "#/components/responses/500"
        '504':
          "$ref": "#/components/responses/504"
      x-requirements:
      - REQ-FUNC-002
      x-screens:
      - SCR-ME-001
      x-db-tables:
      - users
      - external_accounts
      parameters:
      - "$ref": "#/components/parameters/csrf"
  "/api/me":
    get:
      operationId: getMe
      tags:
      - 계정
      summary: 현재 로그인 사용자 조회
      x-access: user
      responses:
        '200':
          description: 현재 로그인 사용자 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                user_id: 1
                email: user@example.com
                display_name: 예시
                role: USER
                survey_completed: false
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
      x-requirements:
      - REQ-FUNC-001
      - REQ-FUNC-002
      - REQ-FUNC-003
      x-screens:
      - SCR-AUTH-001
      - SCR-ME-001
      x-db-tables:
      - users
      - external_accounts
      - user_preferences
      parameters: []
      description: |-
        요구사항: REQ-FUNC-001, REQ-FUNC-002, REQ-FUNC-003
        화면: SCR-AUTH-001, SCR-ME-001
        DB: users, external_accounts, user_preferences
        현재 로그인 사용자 조회
  "/api/auth/session":
    delete:
      operationId: logout
      tags:
      - 계정
      summary: 로그아웃
      x-access: user
      description: |-
        요구사항: REQ-FUNC-001
        화면: SCR-ME-001
        DB: users
        서버의 로그인 상태를 종료한다. 인증 수단별 무효화 방식은 확인 필요.
      responses:
        '204':
          description: 처리 완료, 응답 본문 없음
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '500':
          "$ref": "#/components/responses/500"
      x-requirements:
      - REQ-FUNC-001
      x-screens:
      - SCR-ME-001
      x-db-tables:
      - users
      parameters:
      - "$ref": "#/components/parameters/csrf"
  "/api/menus":
    get:
      operationId: listMenus
      tags:
      - 도감
      summary: 메뉴 목록 조회
      x-access: user
      description: |-
        요구사항: REQ-FUNC-007
        화면: SCR-CATALOG-001
        DB: drink_menus, brands, menu_options, reviews, bookmarks
        카테고리와 페이지로 메뉴를 조회한다. 최신순은 created_at DESC, menu_id DESC. 인기순 기준은 [확인 필요], 현재 제안은 후기 수 DESC, 사용자별 평균의 평균 DESC, menu_id DESC다. 대표 이미지 주소가 null이면 화면에서 기본 이미지를 표시한다.
      parameters:
      - "$ref": "#/components/parameters/category"
      - "$ref": "#/components/parameters/sort"
      - "$ref": "#/components/parameters/page"
      - "$ref": "#/components/parameters/size"
      responses:
        '200':
          description: 메뉴 목록 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MenuPage"
              example:
                items:
                - menu_id: 1
                  brand:
                    brand_id: 1
                    name: 예시
                  name: 예시
                  category: 커피
                  weirdness_level: 초심자
                  representative_image_url: https://example.com/images/drink.webp
                  average_rating: 1
                  review_count: 1
                  is_bookmarked: false
                  created_at: '2026-09-15T09:00:00+09:00'
                page_info:
                  page: 1
                  size: 1
                  total_elements: 1
                  total_pages: 1
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
      x-requirements:
      - REQ-FUNC-007
      x-screens:
      - SCR-CATALOG-001
      x-db-tables:
      - drink_menus
      - brands
      - menu_options
      - reviews
      - bookmarks
    post:
      operationId: createMenu
      tags:
      - 메뉴 등록
      summary: 조합과 후기 통합 등록
      x-access: user
      description: |-
        요구사항: REQ-FUNC-011, REQ-FUNC-012, REQ-FUNC-013
        화면: SCR-SHARE-001
        DB: brands, drink_menus, menu_options, users, reviews, review_images
        브랜드와 입력을 검증하고 같은 브랜드의 기존 메뉴와 추가 재료를 조회한다. 서버가 비교 프롬프트를 생성해 LLM에서 기존 메뉴 ID 또는 null을 받는다. ID는 실제 비교 대상에 포함되는지 검사한다. 유효한 ID이면 그 메뉴에 후기만 생성하고 기존 레시피와 대표 이미지는 유지한다. 정상 null이면 새 메뉴, 옵션과 첫 후기를 생성하고 첫 이미지를 대표 이미지로 지정한다. 둘 다 201과 menu_created를 반환한다. 별도 확인 API나 후보 선택 UI를 두지 않는다. LLM 실패, 파싱 오류, 비교 대상 밖 ID는 등록 실패다. 실패를 신규 판정으로 대체하지 않는다. LLM 호출 완료 후 DB 트랜잭션에서 대상 존재와 브랜드를 다시 확인한다. 동시 신규 조합 중복 방지는 후속 개선 과제이며 현재 설계가 이를 보장하지 않는다.
        AI 모델과 호출 제한은 [확인 필요]. 현재 제안은 전체 20초, 자동 재시도 없음이다. 외부 장애 503, 시간 초과 504, 출력 구조 또는 후보 ID 오류 502. 사용자 입력을 유지하고 수동 재시도를 제공한다.
        이미지 최대 5장, 개인 평점 1~5와 필수 입력은 API에서 검사한다. 파일 형식 JPG/PNG/WebP, 각 5MB, 요청 30MB는 [확인 필요]인 구현 제안이다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                payload:
                  "$ref": "#/components/schemas/NewMenuPayload"
                images:
                  type: array
                  items: &1
                    type: string
                    format: binary
                  maxItems: 5
                  description: 업로드 순서대로 저장. 파일 형식과 용량 제한은 확인 필요.
                  minItems: 1
              required:
              - payload
              - images
            encoding:
              payload:
                contentType: application/json
      responses:
        '201':
          description: 후기 생성 완료. 새 메뉴 생성 또는 기존 메뉴 연결 결과를 menu_created로 구분한다.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MenuCreated"
              examples:
                created_menu:
                  summary: 새 메뉴 생성
                  value:
                    menu_id: 101
                    review_id: 201
                    menu_created: true
                    representative_image_url: https://example.com/images/new.webp
                matched_menu:
                  summary: 기존 메뉴에 후기 연결, 대표 이미지가 없었던 경우
                  value:
                    menu_id: 42
                    review_id: 202
                    menu_created: false
                    representative_image_url:
        '400':
          "$ref": "#/components/responses/400"
        '404':
          "$ref": "#/components/responses/404"
        '413':
          "$ref": "#/components/responses/413"
        '415':
          "$ref": "#/components/responses/415"
        '422':
          "$ref": "#/components/responses/422"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '500':
          "$ref": "#/components/responses/500"
        '502':
          "$ref": "#/components/responses/502"
        '503':
          "$ref": "#/components/responses/503"
        '504':
          "$ref": "#/components/responses/504"
      x-requirements:
      - REQ-FUNC-011
      - REQ-FUNC-012
      - REQ-FUNC-013
      x-screens:
      - SCR-SHARE-001
      x-db-tables:
      - brands
      - drink_menus
      - menu_options
      - users
      - reviews
      - review_images
      parameters:
      - "$ref": "#/components/parameters/csrf"
      x-ai-policy:
        prompt_location: Spring Boot 서버
        timeout_ms: 20000
        automatic_retries: 0
        persist_output: false
        output_schema:
          "$ref": "#/components/schemas/MenuMatchOutput"
        status: timeout과 모델은 [확인 필요], 수치는 구현 제안
  "/api/menus/{menu_id}":
    get:
      operationId: getMenu
      tags:
      - 도감
      summary: 메뉴 상세 조회
      x-access: user
      description: |-
        요구사항: REQ-FUNC-004, REQ-FUNC-006, REQ-FUNC-007
        화면: SCR-SURVEY-001, SCR-HOME-001, SCR-CATALOG-001, SCR-CHAT-001
        DB: user_preferences, drink_menus, menu_options, reviews, brands, bookmarks
        선택한 메뉴와 추가 재료, 평점, 저장 여부를 조회한다. 평점은 사용자별 현재 후기 평균의 평균이다. 후기가 없으면 null로 제안한다. 대표 이미지 URL이 null이면 기본 이미지를 표시한다.
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      responses:
        '200':
          description: 메뉴 상세 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MenuDetail"
              example:
                menu_id: 1
                brand:
                  brand_id: 1
                  name: 예시
                name: 예시
                category: 커피
                weirdness_level: 초심자
                representative_image_url: https://example.com/images/drink.webp
                average_rating: 1
                review_count: 1
                is_bookmarked: false
                created_at: '2026-09-15T09:00:00+09:00'
                base_drink: 예시
                size: 예시
                temperature: 예시
                recipe_description: 예시
                options:
                - action: 추가
                  ingredient_name: 예시
                  quantity: 1
                  unit: 예시
                  option_id: 1
        '404':
          "$ref": "#/components/responses/404"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
      x-requirements:
      - REQ-FUNC-004
      - REQ-FUNC-006
      - REQ-FUNC-007
      x-screens:
      - SCR-SURVEY-001
      - SCR-HOME-001
      - SCR-CATALOG-001
      - SCR-CHAT-001
      x-db-tables:
      - user_preferences
      - drink_menus
      - menu_options
      - reviews
      - brands
      - bookmarks
  "/api/menus/{menu_id}/reviews":
    get:
      operationId: listMenuReviews
      tags:
      - 후기
      summary: 메뉴별 후기 조회
      x-access: user
      parameters:
      - "$ref": "#/components/parameters/menu_id"
      - "$ref": "#/components/parameters/page"
      - "$ref": "#/components/parameters/size"
      responses:
        '200':
          description: 메뉴별 후기 조회 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReviewPage"
              example:
                items:
                - review_id: 1
                  menu_id: 1
                  author:
                    user_id: 1
                    display_name: 예시
                  rating: 1
                  content: 예시
                  images:
                  - image_id: 1
                    image_url: https://example.com/images/drink.webp
                    display_order: 1
                  created_at: '2026-09-15T09:00:00+09:00'
                page_info:
                  page: 1
                  size: 1
                  total_elements: 1
                  total_pages: 1
        '400':
          "$ref": "#/components/responses/400"
        '404':
          "$ref": "#/components/responses/404"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
      x-requirements:
      - REQ-FUNC-008
      x-screens:
      - SCR-CATALOG-001
      x-db-tables:
      - reviews
      - review_images
      - users
      - drink_menus
      description: |-
        요구사항: REQ-FUNC-008
        화면: SCR-CATALOG-001
        DB: reviews, review_images, users, drink_menus
        해당 메뉴에 현재 남아 있는 후기만 created_at DESC, review_id DESC로 조회한다. 사용자 이메일과 비밀번호는 반환하지 않는다.
    post:
      operationId: createReview
      tags:
      - 후기
