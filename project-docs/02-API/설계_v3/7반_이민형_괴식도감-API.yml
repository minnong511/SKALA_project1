components:
  parameters:
    menu_id:
      name: menu_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    brand_id:
      name: brand_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    review_id:
      name: review_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    page:
      name: page
      in: query
      description: 1부터 시작하는 초안
      schema:
        type: integer
        minimum: 1
        default: 1
    size:
      name: size
      in: query
      description: 기본 20개, 최대 100개로 제안
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    category:
      name: category
      in: query
      schema: &3
        type: string
        enum:
        - 커피
        - 스무디
        - 티
    sort:
      name: sort
      in: query
      description: 인기순 점수 산정 방식은 확인 필요
      schema:
        type: string
        enum:
        - latest
        - popular
        default: latest
    csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: GET /api/auth/csrf에서 발급한 토큰. 로그인 후 회전된 토큰을 다시 받아 사용.
      schema:
        type: string
  responses:
    '400':
      description: 입력값을 확인해주세요.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: BAD_REQUEST
            message: 입력값을 확인해주세요.
    '401':
      description: 로그인이 필요합니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: UNAUTHENTICATED
            message: 로그인이 필요합니다.
    '403':
      description: 요청 권한이 없거나 CSRF 토큰이 유효하지 않습니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: 요청 권한이 없거나 CSRF 토큰이 유효하지 않습니다.
    '404':
      description: 대상 데이터를 찾을 수 없습니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: 대상 데이터를 찾을 수 없습니다.
    '409':
      description: 기존 데이터와 충돌합니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: CONFLICT
            message: 기존 데이터와 충돌합니다.
    '413':
      description: 파일 또는 요청 용량 제한을 초과했습니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: PAYLOAD_TOO_LARGE
            message: 파일 또는 요청 용량 제한을 초과했습니다.
    '415':
      description: 지원하지 않는 이미지 형식입니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: UNSUPPORTED_MEDIA_TYPE
            message: 지원하지 않는 이미지 형식입니다.
    '422':
      description: 영수증 확인 실패, 만료 또는 이미 사용한 인증입니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: INVALID_VERIFICATION
            message: 영수증 확인 실패, 만료 또는 이미 사용한 인증입니다.
    '503':
      description: 외부 서비스를 일시적으로 사용할 수 없습니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: UPSTREAM_UNAVAILABLE
            message: 외부 서비스를 일시적으로 사용할 수 없습니다.
    '500':
      description: 요청을 처리하지 못했습니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: INTERNAL_ERROR
            message: 요청을 처리하지 못했습니다.
    '502':
      description: AI 결과 형식 또는 추천 조건이 올바르지 않습니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: INVALID_AI_RESPONSE
            message: AI 결과 형식 또는 추천 조건이 올바르지 않습니다.
    '504':
      description: AI 또는 외부 요청 시간이 초과되었습니다.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: UPSTREAM_TIMEOUT
            message: AI 또는 외부 요청 시간이 초과되었습니다.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: 기계 판독용 오류 코드
          example: BAD_REQUEST
        message:
          type: string
          description: 사용자 안내
          example: 입력값을 확인해주세요.
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
    User:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 50
        role:
          type: string
          enum:
          - USER
          - ADMIN
        survey_completed: *2
      required:
      - user_id
      - email
      - display_name
      - role
      - survey_completed
    Author:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
      required:
      - user_id
      - display_name
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          description: 8자 이상, UTF-8 기준 최대 72바이트 제안. 바이트 제한은 서버가 추가 검사.
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
        display_name:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - email
      - password
      - display_name
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
      required:
      - email
      - password
      additionalProperties: false
    GoogleCredential:
      type: object
      properties:
        id_token:
          type: string
          description: Google ID 토큰. 서버가 서명, iss, aud, exp, sub 및 이메일 확인 상태를 검증한다.
            제공 클라이언트 ID는 환경 설정이다.
          writeOnly: true
      required:
      - id_token
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        user:
          "$ref": "#/components/schemas/User"
      required:
      - user
      description: 서버 세션을 만들고 Set-Cookie로 세션 쿠키를 전달한다. 응답의 사용자 역할과 설문 완료 여부로 화면 분기.
    Brand:
      type: object
      properties:
        brand_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 100
      required:
      - brand_id
      - name
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    PreferenceInput:
      type: object
      properties:
        preferred_categories:
          type: array
          items: *3
          minItems: 1
          uniqueItems: true
        preferred_tastes:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        sweetness_preference:
          type: string
          minLength: 1
          maxLength: 50
        excluded_ingredients:
          type: array
          items:
            type: string
          uniqueItems: true
          description: 먹지 못하는 재료. 해당 없음은 빈 배열.
        challenge_level: &4
          type: string
          enum:
          - 초심자
          - 중급자
          - 상급자
      required:
      - preferred_categories
      - preferred_tastes
      - sweetness_preference
      - excluded_ingredients
      - challenge_level
      description: 현재 사용자 설문 응답 5개. PostgreSQL JSONB 배열로 저장하며 배열 항목은 문자열, 카테고리는 지정
        enum을 검증한다. 세부 문구는 [확인 필요].
      additionalProperties: false
    Preference:
      allOf:
      - "$ref": "#/components/schemas/PreferenceInput"
      - type: object
        properties:
          updated_at: &5
            type: string
            format: date-time
        required:
        - updated_at
    MenuOptionInput:
      type: object
      properties:
        action:
          type: string
          enum:
          - 추가
        ingredient_name:
          type: string
          minLength: 1
          maxLength: 100
        quantity:
          type: number
          nullable: true
          description: 정량 표현이 없으면 null 허용. 수량이 있으면 양수이고 unit은 필수. API에서 검사한다.
          maximum: 99999999.99
          minimum: 0
          exclusiveMinimum: true
        unit:
          type: string
          description: 수량 사용 시 필수
          nullable: true
          maxLength: 30
      required:
      - action
      - ingredient_name
      description: 추가 재료만 입력한다. 기본 음료 전체 재료와 제외 또는 변경 관계는 관리하지 않는다. quantity가 null이면
        unit도 null로 제안하며 수량 사용 시 단위를 필수로 검사한다.
    MenuOption:
      allOf:
      - "$ref": "#/components/schemas/MenuOptionInput"
      - type: object
        properties:
          option_id:
            type: integer
            format: int64
            minimum: 1
        required:
        - option_id
    MenuInput:
      type: object
      properties:
        brand_id:
          type: integer
          format: int64
          minimum: 1
        base_drink:
          type: string
          minLength: 1
          maxLength: 100
        size:
          type: string
          description: 표준값과 누락 처리 기준은 확인 필요
          nullable: true
          maxLength: 50
        temperature:
          type: string
          description: 표준값과 누락 처리 기준은 확인 필요
          nullable: true
          maxLength: 30
        options:
          type: array
          items:
            "$ref": "#/components/schemas/MenuOptionInput"
        name:
          type: string
          minLength: 1
          maxLength: 100
        category: *3
        weirdness_level: *4
        recipe_description:
          type: string
          nullable: true
      required:
      - brand_id
      - base_drink
      - options
      - name
      - category
      - weirdness_level
      description: 추가 재료와 수량만 관리한다. action은 추가만 허용한다. LLM 판정으로 기존 메뉴에 연결되면 입력한 메뉴명과
        조합 정보로 기존 메뉴를 덮어쓰지 않는다.
      additionalProperties: false
    MenuCard:
      type: object
      properties:
        menu_id:
          type: integer
          format: int64
          minimum: 1
        brand:
          "$ref": "#/components/schemas/Brand"
        name:
          type: string
        category: *3
        weirdness_level: *4
        representative_image_url:
          type: string
          format: uri
          nullable: true
        average_rating:
          type: number
          minimum: 1
          maximum: 5
          nullable: true
          description: 메뉴별 각 사용자의 현재 후기 평균을 구한 뒤 그 평균들을 다시 평균낸다. 후기 없는 사용자는 제외, 메뉴에
            후기가 전혀 없으면 null. UI 표시 자릿수는 [확인 필요].
        review_count:
          type: integer
          minimum: 0
        is_bookmarked: *2
        created_at: *5
      required:
      - menu_id
      - brand
      - name
      - category
      - weirdness_level
      - representative_image_url
      - average_rating
      - review_count
      - is_bookmarked
      - created_at
    MenuDetail:
      allOf:
      - "$ref": "#/components/schemas/MenuCard"
      - type: object
        properties:
          base_drink:
            type: string
          size:
            type: string
            nullable: true
          temperature:
            type: string
            nullable: true
          recipe_description:
            type: string
            nullable: true
          options:
            type: array
            items:
              "$ref": "#/components/schemas/MenuOption"
        required:
        - base_drink
        - options
    ReviewImage:
      type: object
      properties:
        image_id:
          type: integer
          format: int64
          minimum: 1
        image_url:
          type: string
          format: uri
        display_order:
          type: integer
          minimum: 1
          maximum: 5
      required:
      - image_id
      - image_url
      - display_order
    Review:
      type: object
      properties:
        review_id:
          type: integer
          format: int64
          minimum: 1
        menu_id:
          type: integer
          format: int64
          minimum: 1
        author:
          "$ref": "#/components/schemas/Author"
        rating: &6
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
          nullable: true
        images:
          type: array
          items:
            "$ref": "#/components/schemas/ReviewImage"
          maxItems: 5
        created_at: *5
      required:
      - review_id
      - menu_id
      - author
      - rating
      - images
      - created_at
      description: 현재 남아 있는 후기. 삭제한 후기와 파일은 제거하며 삭제된 후기는 응답과 평균 계산에 포함하지 않는다.
    ReviewInput:
      type: object
      properties:
        rating: *6
        content:
          type: string
          description: 선택 입력, 최대 2,000자 제안. 삭제 후 영구 본문은 제거한다.
          maxLength: 2000
      required:
      - rating
    NewMenuPayload:
      type: object
      properties:
        menu:
          "$ref": "#/components/schemas/MenuInput"
        first_review:
          "$ref": "#/components/schemas/ReviewInput"
        verification_id:
          type: string
          description: 현재 사용자와 선택 브랜드에 연결된 유효한 인증 식별자
      required:
      - menu
      - first_review
      - verification_id
      description: 한 번 제출한 조합과 후기. first_review는 새 메뉴이면 첫 후기, 기존 메뉴로 판정되면 추가 후기다.
    ReviewPayload:
      allOf:
      - "$ref": "#/components/schemas/ReviewInput"
      - type: object
        properties:
          verification_id:
            type: string
            description: 현재 사용자와 대상 메뉴 브랜드의 인증 식별자
        required:
        - verification_id
    MenuCreated:
      type: object
      properties:
        menu_id:
          type: integer
          format: int64
          minimum: 1
        review_id:
          type: integer
          format: int64
          minimum: 1
        representative_image_url:
          type: string
          format: uri
          nullable: true
        menu_created:
          type: boolean
          description: true는 새 메뉴와 후기 생성, false는 기존 메뉴에 후기 생성
      required:
      - menu_id
      - review_id
      - representative_image_url
      - menu_created
      description: 후기는 두 분기 모두 새로 생성한다. 기존 메뉴 연결이면 해당 메뉴의 레시피와 대표 이미지를 유지한다. 반환 menu_id로
        상세를 조회한다.
    BookmarkState:
      type: object
      properties:
        menu_id:
          type: integer
          format: int64
          minimum: 1
        is_bookmarked: *2
      required:
      - menu_id
      - is_bookmarked
    Bookmark:
      type: object
      properties:
        menu:
          "$ref": "#/components/schemas/MenuCard"
        saved_at: *5
      required:
      - menu
      - saved_at
    MyReview:
      allOf:
      - "$ref": "#/components/schemas/Review"
      - type: object
        properties:
          menu:
            "$ref": "#/components/schemas/MenuCard"
        required:
        - menu
    PageInfo:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total_elements:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      required:
      - page
      - size
      - total_elements
      - total_pages
    MenuPage:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/MenuCard"
        page_info:
          "$ref": "#/components/schemas/PageInfo"
      required:
      - items
      - page_info
    ReviewPage:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Review"
        page_info:
          "$ref": "#/components/schemas/PageInfo"
      required:
      - items
      - page_info
    BookmarkPage:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Bookmark"
        page_info:
          "$ref": "#/components/schemas/PageInfo"
      required:
      - items
      - page_info
    MyReviewPage:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/MyReview"
        page_info:
          "$ref": "#/components/schemas/PageInfo"
      required:
      - items
      - page_info
    Recommendation:
      type: object
      properties:
        menu:
          "$ref": "#/components/schemas/MenuCard"
        reason:
          type: string
          description: 저장된 취향과 현재 요청을 바탕으로 한 추천 이유
      required:
      - menu
      - reason
    RecommendationList:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          maxItems: 3
        generated_at: *5
        ingredient_notice:
          type: string
          description: 기본 음료의 전체 성분은 주문 시 직접 확인하세요. 등록된 추가 재료 정보만 비교하며, 정보가 없다는 이유로
            해당 성분이 없다고 판단하지 않습니다.
          example: 기본 음료의 전체 성분은 주문 시 직접 확인하세요. 등록된 추가 재료 정보만 비교하며, 정보가 없다는 이유로 해당
            성분이 없다고 판단하지 않습니다.
      required:
      - items
      - generated_at
      - ingredient_notice
      description: 홈 추천 최대 3개. 후보 없음은 빈 배열. 결과 영구 저장 없음. 매 요청 결과 동일성은 보장하지 않는다.
    SurveyRecommendation:
      type: object
      properties:
        taste_summary:
          type: string
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          maxItems: 1
        ingredient_notice:
          type: string
          description: 기본 음료의 전체 성분은 주문 시 직접 확인하세요. 등록된 추가 재료 정보만 비교하며, 정보가 없다는 이유로
            해당 성분이 없다고 판단하지 않습니다.
          example: 기본 음료의 전체 성분은 주문 시 직접 확인하세요. 등록된 추가 재료 정보만 비교하며, 정보가 없다는 이유로 해당
            성분이 없다고 판단하지 않습니다.
      required:
      - taste_summary
      - items
      - ingredient_notice
      description: 정상 추천 1개. 후보 없음은 빈 배열로 제안한다.
    ChatRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - message
      description: 현재 메시지와 저장된 취향만 사용한다. 이전 대화는 전달하거나 저장하지 않는다.
      additionalProperties: false
    ChatResult:
      type: object
      properties:
        answer:
          type: string
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Recommendation"
          maxItems: 3
        ingredient_notice:
          type: string
          description: 기본 음료의 전체 성분은 주문 시 직접 확인하세요. 등록된 추가 재료 정보만 비교하며, 정보가 없다는 이유로
            해당 성분이 없다고 판단하지 않습니다.
          example: 기본 음료의 전체 성분은 주문 시 직접 확인하세요. 등록된 추가 재료 정보만 비교하며, 정보가 없다는 이유로 해당
            성분이 없다고 판단하지 않습니다.
      required:
      - answer
      - items
      - ingredient_notice
    VerificationResult:
      type: object
      properties:
        verification_id:
          type: string
        brand_id:
          type: integer
          format: int64
          minimum: 1
        expires_at: *5
        status:
          type: string
          enum:
          - VERIFIED
      required:
      - verification_id
      - brand_id
      - expires_at
      - status
    LevelPatch:
      type: object
      properties:
        weirdness_level:
          type: string
          enum:
          - 초심자
          - 중급자
          - 상급자
      required:
      - weirdness_level
      additionalProperties: false
    CsrfToken:
      type: object
      properties:
        header_name:
          type: string
          enum:
          - X-CSRF-TOKEN
        token:
          type: string
      required:
      - header_name
      - token
    MenuMatchOutput:
      type: integer
      format: int64
      minimum: 1
      nullable: true
      description: 내부 LLM의 JSON 출력. 동일한 기존 메뉴 ID 하나 또는 null. null은 신규 메뉴를 뜻하며 오류나
        빈 응답을 null로 간주하지 않는다.
x-policy-proposals:
- 서버 세션과 CSRF
- 영수증 임시 인증의 저장 방식과 유효 시간
- 파일 형식, 용량, 후기 글자 수
- 홈 추천 개수와 인기순 정렬
- AI 모델과 전체 timeout, 자동 재시도 여부
- 관리자 연결 데이터 삭제 정책
