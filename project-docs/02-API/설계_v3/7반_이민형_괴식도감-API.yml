---
openapi: 3.0.3
info:
  title: 괴식도감 REST API 명세서
  version: 0.3.1
  description: 현재 프로젝트 기술서 초안_v2.md 기준. 등록 API 내부의 LLM 동일 메뉴 자동 판정, 사용자별 후기 평균의 평균,
    추가 재료 관리와 대표 이미지 NULL 처리를 적용한다. 구현 세부 제안은 1단계 [확인 필요] 항목을 따른다.
x-source-document: "../../01-기획-요구사항/설계_v3/02-요구사항정의서.md"
x-related-dbml: "../../03-DB/설계_v3/7반_이민형_괴식도감-DB.dbml"
