<text x="70" y="1540" class="subtitle">bookmarks의 PK는 (user_id, menu_id). 모든 FK는 삭제 제한. 영수증 인증은 별도 임시 상태로 관리.</text>
<text x="70" y="1570" class="subtitle">개인 평점 1~5, 후기 이미지 최대 5장. 가중 평점과 설문 완료 여부는 파생값. 세부 정책은 원본 DBML 참고.</text>
