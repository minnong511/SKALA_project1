<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="1610" viewBox="0 0 1940 1610" role="img" aria-labelledby="title desc">
<title id="title">괴식도감 ERD</title>
<desc id="desc">DBML 기반 9개 테이블의 기본키, 외래키, 데이터 타입과 관계. 화살표는 부모에서 자식 방향이다.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#526b87" stroke-width="2"/></marker>
</defs>
<style>
