.subtitle { font-size: 17px; fill: #526b87; }
.table-name { font-size: 22px; font-weight: 700; fill: white; }
.table-ko { font-size: 16px; fill: #cce5e9; }
.field { font-family: Menlo, Consolas, monospace; font-size: 15px; fill: #20354b; }
